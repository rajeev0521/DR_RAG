seeds: [42, 123, 999]

splits:
  dev_path: "data/splits/dev.json"
  test_path: "data/splits/test.json"

metrics:
  retrieval_k: [1, 5, 10]
  compute_ragas: false  # Set true when LLM judge (OpenAI or Ollama) is enabled; otherwise records explicit null sentinels
  judge_model: "phi3:mini"
  ragas_sample_size: 10

bootstrap:
  num_resamples: 10000
  confidence_level: 0.95
  random_seed: 42
